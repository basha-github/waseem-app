<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wall Calibration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; display: block; }
  #msg {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #14163a; color: #fff; text-align: center; padding: 24px; z-index: 5;
  }
  #msg h1 { margin: 0; font-size: 30px; }
  #status { font-size: 16px; color: #cfd3ff; max-width: 640px; }
  #retry { display: none; font-size: 18px; padding: 12px 26px; border: 0; border-radius: 12px; background: #ff508c; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="msg">
    <h1>🎯 Wall calibration</h1>
    <div id="status">Starting the camera…</div>
    <button id="retry" type="button">Try again</button>
  </div>
  <script type="module" src="calibrate.js"></script>
</body>
</html>
